# Runs the brain validator on every pull request and push to main.
# To make it a required check: GitHub → Settings → Branches → add a rule for `main` → require status check `check`.
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node system/scripts/check.mjs
